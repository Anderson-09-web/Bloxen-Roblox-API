kind = "api"
previewPath = "/"
title = "Bloxen Roblox API"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/"]

[services.development]
run = "python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8080}"

[services.production]

[services.production.build]
args = ["python", "-m", "pip", "install", "-r", "requirements.txt"]

[services.production.run]
args = ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--proxy-headers", "--forwarded-allow-ips", "*"]

[services.production.run.env]
PORT = "8080"
ENVIRONMENT = "production"

[services.production.health.startup]
path = "/health"