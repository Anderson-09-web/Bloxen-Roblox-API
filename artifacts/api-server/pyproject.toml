[project]
name = "bloxen-roblox-api"
version = "1.0.0"
description = "Async FastAPI REST API for the Bloxen Discord bot."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "httpx==0.28.1",
    "SQLAlchemy[asyncio]==2.0.40",
    "asyncpg==0.30.0",
    "aiosqlite==0.21.0",
    "pydantic-settings==2.9.1",
    "python-dotenv==1.1.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
]